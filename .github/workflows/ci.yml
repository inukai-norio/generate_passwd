name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to check (defaults to the triggering commit)
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Test and lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run unit tests and documentation tests
        run: cargo test --locked
