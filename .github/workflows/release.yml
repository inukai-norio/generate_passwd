name: Build and release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

env:
  BINARY_NAME: generate_passwd
  RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}

jobs:
  version:
    name: Check package version change
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      version: ${{ steps.compare.outputs.version }}
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Compare package versions
        id: compare
        env:
          BEFORE_SHA: ${{ github.event.pull_request.base.sha }}
          AFTER_SHA: ${{ env.RELEASE_SHA }}
        run: python3 .github/scripts/check_release_version.py

  check:
    needs: version
    if: needs.version.outputs.changed == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}

  licenses:
    name: Generate license HTML
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Set up stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install cargo-about
        run: |
          cargo install cargo-about --locked --root "$RUNNER_TEMP/cargo-about"
          test -x "$RUNNER_TEMP/cargo-about/bin/cargo-about"
          printf '%s\n' "$RUNNER_TEMP/cargo-about/bin" >> "$GITHUB_PATH"

      - name: Generate license HTML
        run: |
          cargo about --version
          cargo about generate --locked --fail --output-file LICENSES.html about.hbs
          test -s LICENSES.html

      - name: Upload license artifact
        uses: actions/upload-artifact@v7
        with:
          name: license-notices
          path: LICENSES.html
          if-no-files-found: error

  build:
    needs: [check, licenses]
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
          - target: i686-unknown-linux-musl
            os: ubuntu-24.04
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-2025
          - target: i686-pc-windows-msvc
            os: windows-2025
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Download license artifact
        uses: actions/download-artifact@v8
        with:
          name: license-notices
          path: license-docs

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Set up stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Install cross for Linux musl targets
        if: runner.os == 'Linux'
        run: cargo install cross --locked --git https://github.com/cross-rs/cross

      - name: Build Linux release
        if: runner.os == 'Linux'
        run: cross build --locked --release --target ${{ matrix.target }}

      - name: Build macOS and Windows release
        if: runner.os != 'Linux'
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Check package inputs
        shell: bash
        env:
          PACKAGE_BINARY: target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python .github/scripts/check_release_package.py --binary "$PACKAGE_BINARY"

      - name: Package Linux and macOS binary
        if: runner.os != 'Windows'
        run: |
          archive="$BINARY_NAME-${{ matrix.target }}.zip"
          test ! -e "$archive"
          zip -MM --junk-paths "$archive" \
            "target/${{ matrix.target }}/release/$BINARY_NAME" \
            README.md TEST_CODE_LICENSE license-docs/LICENSES.html

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageFiles = @(
            "target/${{ matrix.target }}/release/${env:BINARY_NAME}.exe"
            "README.md"
            "TEST_CODE_LICENSE"
            "license-docs/LICENSES.html"
          )
          Compress-Archive `
            -LiteralPath $packageFiles `
            -DestinationPath "${env:BINARY_NAME}-${{ matrix.target }}.zip" `
            -ErrorAction Stop

      - name: Check package archive
        shell: bash
        env:
          PACKAGE_BINARY: target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}${{ runner.os == 'Windows' && '.exe' || '' }}
          PACKAGE_ARCHIVE: ${{ env.BINARY_NAME }}-${{ matrix.target }}.zip
        run: python .github/scripts/check_release_package.py --binary "$PACKAGE_BINARY" --archive "$PACKAGE_ARCHIVE"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.target }}
          path: ${{ env.BINARY_NAME }}-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.version.outputs.version }}
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: build-*
          merge-multiple: true
          path: dist

      - name: Create prerelease and upload binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip \
            --target "$RELEASE_SHA" \
            --title "Release $RELEASE_TAG" \
            --generate-notes \
            --prerelease
